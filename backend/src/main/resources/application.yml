server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: margdarshi-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/margdarshi?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        "[format_sql]": true
  sql:
    init:
      mode: always

app:
  jwt:
    secret: ${JWT_SECRET:margdarshi_anurag_university_super_secure_jwt_token_secret_2026_key}
    expiration-ms: 604800000 # 7 days
